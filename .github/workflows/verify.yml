name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push
      timeout:
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: seed-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          TIER: ${{ inputs.tier || 'push' }}
        run: echo "matrix=$(node scripts/verification/ci.mjs --matrix "$TIER")" >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    name: Verify / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: seed-ubuntu24-${{ runner.arch }}-browser-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - name: Install frozen dependencies and reserve native runtime disk
        shell: bash
        run: |
          # Native rer journeys require 15 GiB. Only remove .NET if needed,
          # overlapping it with install instead of reclaiming every toolchain.
          reclaim_pid=
          free_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }')
          if [ "$free_kib" -lt "$((20 * 1024 * 1024))" ]; then
            sudo rm -rf -- /usr/share/dotnet &
            reclaim_pid=$!
          fi
          pnpm install --frozen-lockfile
          if [ -n "$reclaim_pid" ]; then wait "$reclaim_pid"; fi
      - run: pnpm run deps
      - name: Install Chromium and system libraries
        if: matrix.browser
        shell: bash
        run: |
          # The runner default hit its 90-second deadline on two heads;
          # kernel.org completed both. Keep the same three signed archives
          # and attempt budget, starting with that working mirror.
          original_sources=$(mktemp)
          sudo cp /etc/apt/sources.list.d/ubuntu.sources "$original_sources"
          trap 'rm -f -- "$original_sources"' EXIT
          mirrors=(http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu runner-default)
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            if [[ $mirror == runner-default ]]; then
              sudo cp "$original_sources" /etc/apt/sources.list.d/ubuntu.sources
            else
              sudo sed -i -E "s@^(URIs:[[:space:]]*)(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?)@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            fi
            printf 'Chromium apt: attempt %s/3 (90s deadline; mirror %s; sources %s)\n' "$attempt" "$mirror" "$(grep -h '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u | tr '\n' ' ')"
            # Root owns the timeout so a stalled apt, dpkg and their locks die
            # with the attempt instead of blocking the next mirror.
            if sudo env "PATH=$PATH" HOME=/root timeout --kill-after=5s 90s bash -ec '
              dpkg --configure -a
              pnpm exec playwright install-deps chromium
            '; then
              printf 'Chromium apt: complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              break
            else
              status=$?
              printf 'Chromium apt: attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt == 3 )); then exit "$status"; fi
            sleep "$((attempt * 2))"
          done
          pnpm exec playwright install chromium
      - name: Run this shard
        env:
          SHARD: ${{ matrix.name }}
          MANGO_TEST_WORK_DIR: ${{ runner.temp }}/mango-verification/${{ matrix.name }}
        run: node scripts/verification/ci.mjs "$SHARD"
      - name: Keep this shard's timings and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.name }}
          path: ${{ runner.temp }}/mango-verification/${{ matrix.name }}/evidence
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [plan, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shards.result }}
        run: test "$PLAN" = success && test "$SHARDS" = success
