name: Run site credential probe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: run-site
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - name: Read-only provider checks
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const domain = 'run-mango.com';
          const service = 'mango-production--site';
          const report = (label, status, success) => console.log(JSON.stringify({ label, status, success }));
          async function get(path) {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
                method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { Authorization: `Bearer ${token}` },
              });
              return { status: response.status, body: await response.json().catch(() => null) };
            } catch {
              return { status: 0, body: null };
            }
          }
          const ok = response => response.status === 200 && response.body?.success === true;
          try {
            const inputsOK = account === 'b20c0ca9cab0c2b70e13d7cf724b89bd' && Boolean(token);
            report('intended account and credential present', 0, inputsOK);
            if (!inputsOK) {
              process.exitCode = 1;
            } else {
              const verification = await get(`/accounts/${account}/tokens/verify`);
              const tokenOK = ok(verification) && verification.body.result?.status === 'active';
              report('account token active', verification.status, tokenOK);
              const zones = await get(`/zones?name=${domain}&account.id=${account}`);
              const zone = zones.body?.result?.[0];
              const zoneOK = ok(zones) && Array.isArray(zones.body.result) && zones.body.result.length === 1 && zone?.name === domain && zone.status === 'active' && zone.account?.id === account && /^[a-f0-9]{32}$/.test(zone.id);
              report('intended active zone', zones.status, zoneOK);
              const settings = await get(`/accounts/${account}/workers/scripts/${service}/settings`);
              const absent = settings.status === 404;
              report('site worker absent', settings.status, absent);
              let owned = false;
              if (ok(settings)) {
                const deployments = await get(`/accounts/${account}/workers/scripts/${service}/deployments`);
                const versions = await get(`/accounts/${account}/workers/scripts/${service}/versions`);
                const latest = deployments.body?.result?.deployments?.[0];
                const served = latest?.versions?.length === 1 && latest.versions[0].percentage === 100 ? latest.versions[0].version_id : null;
                const newest = versions.body?.result?.items?.[0]?.id;
                const current = ok(deployments) && ok(versions) && typeof served === 'string' && served === newest;
                report('site worker current single version', deployments.status, current);
                if (current) {
                  const version = await get(`/accounts/${account}/workers/scripts/${service}/versions/${encodeURIComponent(served)}`);
                  owned = ok(version) && /^rer-site:[0-9a-f]{64}$/.test(version.body.result?.annotations?.['workers/message'] ?? '');
                  report('site worker owned by deploy kit', version.status, owned);
                }
              }
              let domainsOK = false;
              if (zoneOK) {
                const domains = await get(`/accounts/${account}/workers/domains?zone_id=${zone.id}`);
                const inventoryOK = ok(domains) && Array.isArray(domains.body.result) && !(domains.body.result_info?.total_pages > 1);
                domainsOK = inventoryOK && [domain, `www.${domain}`].every(hostname => {
                  const matches = domains.body.result.filter(row => row?.hostname === hostname);
                  return matches.length === 0 || (owned && matches.length === 1 && matches[0].service === service && matches[0].zone_id === zone.id && matches[0].environment === 'production');
                });
                report('site hostnames absent or owned', domains.status, domainsOK);
              }
              if (!tokenOK || !zoneOK || !(absent || owned) || !domainsOK) process.exitCode = 1;
            }
          } catch {
            report('probe completed', 0, false);
            process.exitCode = 1;
          }
          NODE
